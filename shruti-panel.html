<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shruti Panel</title>
<style>
  :root {
    --page:#e9e9e6; --face1:#dcdcd9; --face2:#c6c6c3; --panel1:#e4e4e1; --panel2:#d8d8d5; --hair:rgba(0,0,0,.14);
    --ink:#2a2a2a; --dim:#7a7a78; --track:#b9b9b6; --track-in:rgba(0,0,0,.35); --slot:#1a1a1a; --ribbon:#bdbdba;
    --knob1:#3c3c3c; --knob2:#1a1a1a; --knob3:#0d0d0d; --index:#f4f4f2; --slider1:#3a3a3a; --slider2:#161616;
    --held:#e8622a; --tick:rgba(0,0,0,.35); --hi:rgba(255,255,255,.8); --shadow:rgba(0,0,0,.35);
    color-scheme: light;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--page); color:var(--ink); font:13px/1.3 "Inter", -apple-system, system-ui, "Helvetica Neue", sans-serif; display:flex; flex-direction:column; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); -webkit-user-select:none; user-select:none; touch-action:none; overscroll-behavior:none; }
  .chassis { flex:1; min-height:0; display:flex; }
  .face { flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; padding:18px 20px 12px; position:relative; border-radius:22px; background:linear-gradient(180deg, var(--face1), var(--face2)); box-shadow:0 30px 60px var(--shadow), 0 2px 0 var(--hi) inset, 0 0 0 1px rgba(0,0,0,.18); }
  .screw { display:none; }

  .legend, .n, .lbl, .sw div.lab, .mini, .tog, .oct, .hdr-btn, .strip .cap, .ribbon .rl, .vsw .vlabels div { color:var(--ink); font-weight:500; letter-spacing:.12em; text-transform:uppercase; }
  header { display:flex; flex-wrap:nowrap; align-items:center; gap:8px 22px; padding:4px 4px 12px; border-bottom:1px solid var(--hair); }
  .switches { display:flex; align-items:center; gap:22px; flex:0 0 auto; }
  header > span:first-child { flex:0 0 auto; }
  @media (max-width: 1400px) { header > span:first-child > span { display:none; } }
  @media (max-width: 1180px) { header .btns { gap:10px; } header .mini { gap:4px; } }
  .syncgrp { display:flex; align-items:center; gap:10px; }
  header .btns { margin-left:auto; gap:16px; flex-wrap:nowrap; flex:0 1 auto; }
  .tog.big { height:34px; font-size:9px; letter-spacing:.22em; gap:8px; }
  .tog.big .track { width:58px; height:22px; }
  .tog.big .lever { top:2px; left:2px; width:24px; height:18px; }
  .tog.big.on .lever { left:32px; }
  header > span:first-child { display:flex; align-items:baseline; gap:12px; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  header b { font-weight:600; font-size:15px; letter-spacing:.22em; color:var(--ink); }

  /* interval switch */
  .sw { position:relative; display:grid; grid-template-columns:1fr 1fr; width:190px; height:34px; align-items:center; cursor:pointer; touch-action:none; }
  .sw::before { content:""; position:absolute; left:50%; top:50%; width:58px; height:22px; margin:-11px 0 0 -29px; border-radius:999px; background:var(--track); box-shadow:inset 0 1px 3px var(--track-in), 0 1px 0 var(--hi); }
  .sw .k { position:absolute; top:50%; width:24px; height:18px; margin-top:-9px; border-radius:999px; background:linear-gradient(180deg, var(--slider1), var(--slider2)); box-shadow:0 2px 4px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15); transition:left .12s; left:calc(50% - 27px); }
  .sw[style*="--i: 1"] .k, .sw[style*="--i:1"] .k { left:calc(50% + 3px); }
  .sw div.lab { font-size:9px; pointer-events:none; }
  .sw div.lab:first-of-type { text-align:right; padding-right:36px; }
  .sw div.lab:last-of-type { text-align:left; padding-left:36px; }

  .btns { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .synclab { font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink); font-weight:500; }

  main { flex:1; min-height:0; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; }
  .box { display:flex; flex-direction:column; gap:8px; min-height:0; }
  .head { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 6px 10px; border:1px solid var(--hair); border-radius:16px; background:linear-gradient(180deg, var(--panel1), var(--panel2)); box-shadow:inset 0 1px 0 var(--hi), 0 1px 2px rgba(0,0,0,.08); }
  .head .n { font-size:9px; letter-spacing:.3em; }
  .head .n small { color:var(--dim); letter-spacing:.06em; text-transform:none; margin-left:6px; }

  /* voice selector */
  .vsw { position:relative; width:160px; height:124px; margin:0 auto; cursor:pointer; touch-action:none; }
  .vsw .vk { position:absolute; left:50%; top:40px; width:52px; height:52px; margin-left:-26px; border-radius:50%; background:radial-gradient(circle at 50% 30%, var(--knob1), var(--knob2) 65%, var(--knob3)); box-shadow:0 8px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12); }
  .vsw .vptr { position:absolute; left:50%; top:50%; width:3px; height:20px; margin:-24px 0 0 -1.5px; border-radius:2px; background:var(--index); transform-origin:50% 24px; transform:rotate(var(--r, -135deg)); transition:transform .12s; }
  .vsw .vlabels div { position:absolute; font-size:8.5px; letter-spacing:.14em; transform:translate(-50%, -50%); white-space:nowrap; }

  /* toggles */
  .tog { display:flex; align-items:center; gap:6px; height:30px; cursor:pointer; touch-action:manipulation; font-size:8px; letter-spacing:.2em; }
  .tog .track { position:relative; width:44px; height:18px; border-radius:999px; background:var(--track); box-shadow:inset 0 1px 3px var(--track-in), 0 1px 0 var(--hi); }
  .tog .lever { position:absolute; top:2px; left:2px; width:20px; height:14px; border-radius:999px; background:linear-gradient(180deg, var(--slider1), var(--slider2)); box-shadow:0 2px 4px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15); transition:left .12s; }
  .tog.on .lever { left:22px; }
  .oct { position:relative; height:30px; padding:0 8px 0 56px; border:0; background:transparent; font:inherit; font-size:8px; letter-spacing:.2em; cursor:pointer; touch-action:manipulation; }
  .oct::before { content:""; position:absolute; left:6px; top:50%; width:44px; height:18px; margin-top:-9px; border-radius:999px; background:var(--track); box-shadow:inset 0 1px 3px var(--track-in), 0 1px 0 var(--hi); }
  .oct::after { content:""; position:absolute; left:8px; top:50%; width:20px; height:14px; margin-top:-7px; border-radius:999px; background:linear-gradient(180deg, var(--slider1), var(--slider2)); box-shadow:0 2px 4px rgba(0,0,0,.35); transition:left .12s; }
  .oct.on::after { left:28px; }

  /* knobs */
  .fx { display:grid; grid-template-columns:repeat(3, 64px); justify-content:center; gap:22px 22px; margin-top:20px; margin-bottom:6px; }
  .mini { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:8px; letter-spacing:.2em; }
  .mini .md { position:relative; width:38px; height:38px; border-radius:50%; background:radial-gradient(circle at 50% 30%, var(--knob1), var(--knob2) 65%, var(--knob3)); box-shadow:0 6px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12); cursor:ns-resize; touch-action:none; }
  .mini .md .arc { position:absolute; inset:-6px; border-radius:50%; pointer-events:none; }
  .mini .md .arc::before { content:""; position:absolute; inset:0; border-radius:50%; background:repeating-conic-gradient(from 225deg, var(--dim) 0 2deg, transparent 2deg 27deg); -webkit-mask:radial-gradient(circle, transparent 80%, #000 81%, #000 92%, transparent 93%), conic-gradient(from 225deg, #000 0 272deg, transparent 272deg); -webkit-mask-composite:source-in; mask:radial-gradient(circle, transparent 80%, #000 81%, #000 92%, transparent 93%), conic-gradient(from 225deg, #000 0 272deg, transparent 272deg); mask-composite:intersect; }
  .mini .md .ptr { position:absolute; left:50%; top:50%; width:2px; height:12px; margin:-15px 0 0 -1px; border-radius:1px; background:var(--index); transform-origin:50% 15px; transform:rotate(var(--r, -135deg)); pointer-events:none; }
  .mini output { display:none; }
  header .mini { flex-direction:row; gap:6px; }


  /* fader + ribbon */
  .lower { flex:1; min-height:0; display:flex; gap:8px; }
  .lower .strip { flex:1 1 0; min-width:0; }
  .strip, .ribbon { position:relative; border:1px solid var(--hair); border-radius:16px; background:linear-gradient(180deg, var(--panel1), var(--panel2)); box-shadow:inset 0 1px 0 var(--hi); overflow:hidden; cursor:pointer; touch-action:none; }
  .strip .glow, .strip .level { display:none; }
  .strip::before { content:""; position:absolute; left:50%; top:28px; bottom:28px; width:6px; margin-left:-3px; border-radius:3px; background:var(--slot); box-shadow:inset 0 1px 2px rgba(0,0,0,.6); }
  .strip .ticks i { position:absolute; left:calc(50% + 14px); width:12px; border-top:1px solid var(--tick); pointer-events:none; }
  .strip .ticks i::after { position:absolute; left:16px; top:-7px; font-size:8px; color:var(--dim); letter-spacing:.1em; }
  .strip .ticks i:nth-child(1)::after { content:"7"; } .strip .ticks i:nth-child(2)::after { content:"5"; } .strip .ticks i:nth-child(3)::after { content:"3"; }
  .strip .handle { position:absolute; left:50%; width:36px; height:22px; margin:-11px 0 0 -18px; border-radius:6px; background:linear-gradient(180deg, var(--slider1), var(--slider2)); box-shadow:0 6px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15); pointer-events:none; }
  .strip .handle::after { content:""; position:absolute; left:8px; right:8px; top:50%; height:2px; margin-top:-1px; background:var(--index); }
  .strip.held .handle::after { background:var(--held); }
  .strip .cap { position:absolute; left:0; right:0; text-align:center; font-size:8px; letter-spacing:.22em; pointer-events:none; }
  .strip .cap.t { top:8px; } .strip .cap.b { bottom:8px; }
  .ribcol { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:stretch; min-height:0; }
  .ribbon { flex:1; min-height:0; }
  .ribbon::before { content:""; position:absolute; top:28px; bottom:28px; left:27%; right:27%; border-radius:12px; background:var(--ribbon); box-shadow:inset 0 1px 3px rgba(0,0,0,.3); }
  .ribbon .rl { position:absolute; left:0; right:0; text-align:center; font-size:7px; letter-spacing:.18em; pointer-events:none; }
  .ribbon .rl.t { top:8px; } .ribbon .rl.b { bottom:8px; } .ribbon .rl.m { display:none; }
  .ribbon .dot { position:absolute; left:50%; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:rgba(127,127,127,.25); border:1px solid rgba(127,127,127,.5); opacity:0; pointer-events:none; }
  .ribbon.touch .dot { opacity:1; }
  .rlab { display:none; }

</style>
</head>
<body>
<div class="chassis"><div class="face">
  <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
  <header>
    <span><b>SHRUTI 4</b><span>four box drone · solid state · B2</span></span>
    <div class="switches"><div class="sw" id="sw"><div class="k"></div></div><div class="syncgrp"><span class="synclab">Pump sync</span><div class="tog big" id="lock" role="switch" title="Box 1 is the clock; the other pumps snap to fractions of it"><span>off</span><div class="track"><div class="lever"></div></div><span>on</span></div></div></div>
    <div class="btns"><div class="mini" id="age"><span>Age</span><div class="md"><div class="arc"></div><div class="ptr"></div></div><output></output></div><div class="mini" id="breath"><span>Breath</span><div class="md"><div class="arc"></div><div class="ptr"></div></div><output></output></div><div class="mini" id="width"><span>Width</span><div class="md"><div class="arc"></div><div class="ptr"></div></div><output></output></div><div class="mini" id="master"><span>Level</span><div class="md"><div class="arc"></div><div class="ptr"></div></div><output></output></div></div>
  </header>

  <main id="boxes"></main>

</div></div>

<script>
'use strict';
const N_BOX = 4;
let age = 0.42, breath = 0.5, masterLvl = 0.707, width = 0.5;   // header knobs, 0..1
const widthCents = () => 12 * width;                  // left/right reed split, ±cents
const driftCents = () => 25 * age;                    // 0.42 -> 10.5 cents, the setting Ian liked
const ageScale = () => age / 0.42;                    // scales the fixed between-box offsets
const NOTE = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const HOME_MIN = 43, HOME_MAX = 62;   // G2 .. D4
let homeMidi = 47;                    // B2
const homeHz = () => 440 * Math.pow(2, (homeMidi - 69) / 12);
const homeName = () => NOTE[homeMidi % 12] + (Math.floor(homeMidi / 12) - 1);
// A box is a set of tuned voices behind a bellows. 'I' is the interval chosen by the switch (fifth or fourth).
// Pad voicings and ceilings were derived from measurements of commercial ambient pad loops, then renamed for what they are.
const VOICES = {
  reed:   { name: 'Reed',         wave: 'reed', lp: 1,    attack: 0.28, root: 1,   slots: [['1', 1], ['I', 1], ['2', 1]] },
  tropo:  { name: 'Bed',    wave: 'dark', lp: 0.52, attack: 2.0,  root: 2, gain: 2.0, slots: [['2', 1], ['I', 0.45], ['4', 0.65], ['2I', 0.5], ['4I', 0.2]] },
  strato: { name: 'Deep',  wave: 'dark', lp: 0.18, attack: 2.0,  root: 1, gain: 1.1, slots: [['1', 1], ['I/2', 0.7], ['1/2', 0.35], ['I', 0.5], ['2', 0.3]] },
  meso:   { name: 'Haze',  wave: 'dark', lp: 0.30, attack: 3.0,  root: 2, gain: 2.2, slots: [['2', 1], ['I', 0.3], ['2I', 0.5], ['4', 0.3], ['9/2', 0.08]] },
  thermo: { name: 'Pulse', wave: 'dark', lp: 0.14, attack: 1.5,  root: 1, gain: 1.1, slots: [['1', 1], ['I/2', 0.5], ['I', 0.45], ['2', 0.3]] },
  exo:    { name: 'Glow',  wave: 'dark', lp: 3.2,  attack: 2.5,  root: 2, gain: 1.6, slots: [['2', 1], ['2I', 0.6], ['4', 0.85], ['4I', 0.55], ['8', 0.6], ['8I', 0.3]] },
};
function ratioOf(slot) {
  const I = mode === 'fifth' ? 3 / 2 : 4 / 3;
  return { '1': 1, '2': 2, '4': 4, '8': 8, '1/2': 0.5, '1/4': 0.25, '9/4': 2.25, '9/2': 4.5, 'I': I, 'I/2': I / 2, 'I/4': I / 4, '2I': 2 * I, '4I': 4 * I, '8I': 8 * I }[slot];
}
// Switch positions, left to right. Each opens home + one interval + octave. One at a time, so nothing can clash.
const MODE_LIST = [
  { id: 'fourth',   name: 'Fourth',    ratio: '4 : 3' },
  { id: 'fifth',    name: 'Fifth',     ratio: '3 : 2' },
];
const RATE_MIN = 1 / 40, RATE_MAX = 6;   // one stroke per 40 s up to 6 per second
const HOLD_RATE = 1 / 36;                 // at or below this the bellows is held where it is
const BOX_OFFSETS = [0, 3.5, -2.5, 5];
const boxOffset = i => BOX_OFFSETS[i] * ageScale();
const $ = id => document.getElementById(id);

let ctx = null, S = null, mode = 'fifth', lock = false;
const RENDERS = [];
const ROOM = 0.45;   // fixed medium hall
function impulse(seconds, decay) {
  const len = Math.max(1, Math.floor(ctx.sampleRate * seconds)), buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return buf;
}
function setRoomSize(k) { if (S) S.conv.buffer = impulse(0.6 + 6.5 * k, 3.2 - 1.4 * k); }
const RATIOS = [1 / 2, 2 / 3, 1, 3 / 2, 2, 3];
const RATIO_NAME = ['×½', '×⅔', '×1', '×1½', '×2', '×3'];
const effRate = b => (lock && b.i > 0) ? Math.min(8, boxes[0].rate * RATIOS[b.ri]) : b.rate;
const boxes = [];

// ---------- Audio ----------
function reedWave() {
  const N = 64, re = new Float32Array(N), im = new Float32Array(N);
  for (let n = 1; n < N; n++) { let a = 1 / Math.pow(n, 1.05); if (n >= 3 && n <= 7) a *= 1.35; if (n > 30) a *= Math.pow(0.9, n - 30); im[n] = a; }
  return ctx.createPeriodicWave(re, im);
}
function darkWave() {   // pad wave: harmonics falling like 1/n^1.7, the low-pass does the rest
  const N = 24, re = new Float32Array(N), im = new Float32Array(N);
  for (let n = 1; n < N; n++) im[n] = 1 / Math.pow(n, 1.7);
  return ctx.createPeriodicWave(re, im);
}
function ensureAudio() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const g = v => { const n = ctx.createGain(); n.gain.value = v; return n; };
  S = { g, wave: reedWave(), dark: darkWave() };
  S.body = g(1);
  S.f1 = ctx.createBiquadFilter(); S.f1.type = 'peaking'; S.f1.frequency.value = 620; S.f1.Q.value = 1.6; S.f1.gain.value = 5;
  S.f2 = ctx.createBiquadFilter(); S.f2.type = 'peaking'; S.f2.frequency.value = 1750; S.f2.Q.value = 2.2; S.f2.gain.value = 4;
  S.hp = ctx.createBiquadFilter(); S.hp.type = 'highpass'; S.hp.frequency.value = 70;
  S.master = g(0.9 * masterLvl * masterLvl);
  S.body.connect(S.f1).connect(S.f2).connect(S.hp).connect(S.master).connect(ctx.destination);
  S.conv = ctx.createConvolver(); S.revOut = g(0.9);
  S.revLp = ctx.createBiquadFilter(); S.revLp.type = 'lowpass'; S.revLp.frequency.value = 4500;   // rooms swallow highs
  S.conv.connect(S.revLp).connect(S.revOut).connect(S.master);
  setRoomSize(ROOM);
  const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  S.noise = ctx.createBufferSource(); S.noise.buffer = buf; S.noise.loop = true; S.noise.start();
  S.nbp = ctx.createBiquadFilter(); S.nbp.type = 'bandpass'; S.nbp.frequency.value = 2600; S.nbp.Q.value = 0.7;
  S.noise.connect(S.nbp);
  boxes.forEach(buildBox);
}
function buildBox(b) {
  const g = S.g, a = { reeds: {} };
  a.sum = g(1);
  a.lp = ctx.createBiquadFilter(); a.lp.type = 'lowpass'; a.lp.frequency.value = 2500; a.lp.Q.value = 0.3;
  a.pressure = g(0);
  a.pre = g(1); a.post = g(1);
  a.shaper = ctx.createWaveShaper(); a.shaper.oversample = '2x';
  a.shaper.curve = driveCurve(b.drive);
  a.level = g(b.vol * b.vol);   // squared so the knob feels even to the ear
  a.pan = ctx.createStereoPanner(); a.pan.pan.value = b.pan;
  a.fold = ctx.createWaveShaper(); a.fold.oversample = '2x'; a.fold.curve = gritCurve(b.grit);
  a.pres = ctx.createBiquadFilter(); a.pres.type = 'peaking'; a.pres.frequency.value = 3000; a.pres.Q.value = 0.9; a.pres.gain.value = 0;
  a.sum.connect(a.pre).connect(a.shaper).connect(a.post).connect(a.fold).connect(a.pres).connect(a.lp).connect(a.pressure).connect(a.level).connect(a.pan).connect(S.body);
  a.send = g(b.room); a.pan.connect(a.send).connect(S.conv);   // reverb send follows level and position
  a.ngain = g(0); S.nbp.connect(a.ngain).connect(a.pressure);
  a.bend = ctx.createConstantSource(); a.bend.offset.value = 0; a.bend.start();
  b.a = a;
  buildVoice(b);
  applyReeds(b);
}
const now = () => ctx.currentTime;
// Grit curve: identity at 0, blending into a wavefold. Folding bends peaks back and sprays harmonics; that is the nasty.
function gritCurve(gr) {
  const N = 2048, c = new Float32Array(N), amt = gr * gr;
  for (let i = 0; i < N; i++) {
    const x = i / (N - 1) * 2 - 1;
    const fold = Math.sin(x * (1 + 6 * gr) * Math.PI / 2);
    c[i] = x * (1 - amt) + fold * amt;
  }
  return c;
}
function applyGrit(b) {
  if (!b.a) return;
  b.a.fold.curve = gritCurve(b.grit);
  b.a.pres.gain.setTargetAtTime(14 * b.grit, now(), 0.05);   // presence lift, up to +14 dB at 3 kHz
}
// Drive curve: below half it is a soft tanh (warmth); above half it blends toward a hard clip (real distortion).
function driveCurve(d) {
  const N = 2048, c = new Float32Array(N), hard = Math.max(0, (d - 0.5) * 2);
  for (let i = 0; i < N; i++) {
    const x = i / (N - 1) * 2 - 1;
    const soft = Math.tanh(1.6 * x) / Math.tanh(1.6);
    const clip = Math.max(-1, Math.min(1, x * 2.5));
    c[i] = soft * (1 - hard) + clip * hard;
  }
  return c;
}
const reedHz = (b, slot) => homeHz() * ratioOf(slot) * (b.oct ? 0.5 : 1);
function buildVoice(b) {
  const a = b.a, g = S.g, V = VOICES[b.voice], wave = V.wave === 'reed' ? S.wave : S.dark;
  a.reeds = {}; b.built = b.voice;
  V.slots.forEach(([slot, lvl], i) => {
    // Each voice is a pair: one oscillator per ear, split by ±width cents, each with its own slow drift.
    const merge = ctx.createChannelMerger(2), gate = g(0);
    const side = (sgn, k) => {
      const o = ctx.createOscillator(); o.setPeriodicWave(wave); o.frequency.value = reedHz(b, slot);
      o.detune.value = boxOffset(b.i) + sgn * widthCents();
      const lfo = ctx.createOscillator(), lg = g(driftCents());

}

const reedDet = (b, sgn) => boxOffset(b.i) + sgn * widthCents();

function levelFor(b, slot) {

// ---------- Boxes ----------
const host = $('boxes');
for (let i = 0; i < N_BOX; i++) {
  const el = document.createElement('div'); el.className = 'box';
  el.innerHTML = `
    <div class="head"><div class="n">Box ${i + 1}</div><div class="vsw" title="voice: click to step, drag to turn"><div class="vlabels"></div><div class="vk"><div class="vptr"></div></div></div><div class="btns"><div class="tog pw" role="switch" title="off / on"><span>off</span><div class="track"><div class="lever"></div></div><span>on</span></div><button class="oct" title="drop this box one octave">1 oct ↓</button></div><div class="fx"><div class="mini" data-fx="pump"><div class="md"><div class="arc"></div><div class="ptr"></div></div><span>Pump</span><output></output></div><div class="mini" data-fx="drive"><div class="md"><div class="arc"></div><div class="ptr"></div></div><span>Drive</span><output></output></div><div class="mini" data-fx="grit"><div class="md"><div class="arc"></div><div class="ptr"></div></div><span>Grit</span><output></output></div><div class="mini" data-fx="room"><div class="md"><div class="arc"></div><div class="ptr"></div></div><span>Room</span><output></output></div><div class="mini" data-fx="level"><div class="md"><div class="arc"></div><div class="ptr"></div></div><span>Level</span><output></output></div><div class="mini" data-fx="pan"><div class="md"><div class="arc"></div><div class="ptr"></div></div><span>Pan</span><output></output></div></div></div>
    <div class="lower"><div class="strip"><div class="ticks">${[0.25,0.5,0.75].map(f => `<i style="top:${f*100}%"></i>`).join('')}</div><div class="level"></div><div class="glow"></div><div class="handle"></div><div class="cap t">bright · full</div><div class="cap b">dark · soft</div></div><div class="ribcol"><div class="ribbon" title="squeeze: momentary air"><span class="rl t">push</span><span class="rl b">rest</span><span class="rl m">squeeze</span><div class="dot"></div></div><div class="rlab">squeeze</div></div></div>`;
  host.appendChild(el);
  const b = { i, el, on: false, hold: false, v: 0.5, rate: 0.35, ri: 2, voice: 'reed', drive: 0, grit: 0, room: 0.25, vol: 0.8, oct: false, pan: [-0.6, -0.2, 0.2, 0.6][i], pressure: 0, target: 0, phase: Math.random(), a: null,
    strip: el.querySelector('.strip'), nameEl: el.querySelector('.n'), pw: el.querySelector('.pw'),
    level: el.querySelector('.level'), glow: el.querySelector('.glow'), handle: el.querySelector('.handle'), needle: el.querySelector('.needle'),
    ribbon: el.querySelector('.ribbon'), dot: el.querySelector('.dot'), sq: 0, sqTarget: 0, heldBase: null };
  boxes.push(b);

  // Strip: finger height = voice (latches)
  const setFromEvent = e => { const rc = b.strip.getBoundingClientRect(); b.v = Math.max(0, Math.min(1, 1 - (e.clientY - rc.top) / rc.height)); renderBox(b); applyReeds(b, true); };

  const up = e => { if (b.drag === e.pointerId) b.drag = null; };

  b.pw.addEventListener('click', () => { ensureAudio(); setOn(b, !b.on); });
  // Ribbon: momentary squeeze. Position = how much extra air; release returns to rest.
  const rib = e => { const rc = b.ribbon.getBoundingClientRect(); const y = Math.max(0, Math.min(1, 1 - (e.clientY - rc.top - 28) / (rc.height - 56))); b.sqTarget = y; b.dot.style.top = (28 + (1 - y) * (rc.height - 56)) + 'px'; };
  b.ribbon.addEventListener('pointerdown', e => { ensureAudio(); try { b.ribbon.setPointerCapture(e.pointerId); } catch (_) {} b.rdrag = e.pointerId; b.ribbon.classList.add('touch'); if (!b.on) setOn(b, true); rib(e); });

  b.ribbon.addEventListener('pointerup', rup); b.ribbon.addEventListener('pointercancel', rup);
  // Voice: a six-position rotary switch, names printed around it. Click steps, drag turns.

  const ids = Object.keys(VOICES), labs = el.querySelector('.vlabels');
  const ang = i => -135 + i * 270 / (ids.length - 1);
  b.vlab = ids.map((id, i) => { const d = document.createElement('div'); d.textContent = VOICES[id].name; const a = (ang(i) - 90) * Math.PI / 180; d.style.left = (80 + 64 * Math.cos(a)) + 'px'; d.style.top = (66 + 44 * Math.sin(a)) + 'px'; labs.appendChild(d); return d; });

  b.vsw.addEventListener('pointerdown', e => { ensureAudio(); try { b.vsw.setPointerCapture(e.pointerId); } catch (_) {} vdrag = e.pointerId; vy0 = e.clientY; vi0 = ids.indexOf(b.voice); vmoved = false; });
  b.vsw.addEventListener('pointermove', e => { if (vdrag !== e.pointerId) return; const step = Math.round((vy0 - e.clientY) / 28); if (step !== 0) vmoved = true; const i = Math.max(0, Math.min(ids.length - 1, vi0 + step)); if (ids[i] !== b.voice) setVoice(b, ids[i]); });

  b.vsw.addEventListener('pointercancel', () => vdrag = null);
  b.octBtn = el.querySelector('.oct');
  b.octBtn.addEventListener('click', () => { ensureAudio(); setOct(b, !b.oct); });

}
function setOn(b, on) { b.on = on; applyReeds(b); renderBox(b); }
// Small knob: drag up/down or scroll. get/set work in 0..1.
function miniDial(root, get, set, fmt) {
  const md = root.querySelector('.md'), out = root.querySelector('output');
  const render = () => { const f = get(); md.style.setProperty('--a', (f * 270) + 'deg'); md.style.setProperty('--r', (-135 + f * 270) + 'deg'); out.textContent = fmt(f); };
  let id = null, y0 = 0, f0 = 0;
  md.addEventListener('pointerdown', e => { ensureAudio(); try { md.setPointerCapture(e.pointerId); } catch (_) {} id = e.pointerId; y0 = e.clientY; f0 = get(); });
  md.addEventListener('pointermove', e => { if (id !== e.pointerId) return; set(Math.max(0, Math.min(1, f0 + (y0 - e.clientY) / 140))); render(); });
  const up = e => { if (id === e.pointerId) id = null; };

const fmtRateText = r => r <= HOLD_RATE ? 'hold' : r < 1 ? Math.round(r * 60) + '/min' : r.toFixed(1) + '/s';
boxes.forEach(b => {
  b.renderPump = miniDial(b.el.querySelector('[data-fx=pump]'),
    () => (lock && b.i > 0) ? b.ri / (RATIOS.length - 1) : Math.log(b.rate / RATE_MIN) / Math.log(RATE_MAX / RATE_MIN),
    f => {

      b.rate = RATE_MIN * Math.pow(RATE_MAX / RATE_MIN, f);

    },
    () => isHeld(b) ? 'hold' : (lock && b.i > 0) ? RATIO_NAME[b.ri] + ' ' + fmtRateText(effRate(b)) : fmtRateText(effRate(b)));
  miniDial(b.el.querySelector('[data-fx=drive]'), () => b.drive, v => { b.drive = v; if (b.a) b.a.shaper.curve = driveCurve(v); }, f => Math.round(f * 100) + '%');
  miniDial(b.el.querySelector('[data-fx=grit]'), () => b.grit, v => { b.grit = v; applyGrit(b); }, f => Math.round(f * 100) + '%');
  miniDial(b.el.querySelector('[data-fx=room]'), () => b.room, v => { b.room = v; if (b.a) b.a.send.gain.setTargetAtTime(v, now(), 0.05); }, f => Math.round(f * 100) + '%');
  miniDial(b.el.querySelector('[data-fx=pan]'), () => (b.pan + 1) / 2, v => { b.pan = v * 2 - 1; if (b.a) b.a.pan.pan.setTargetAtTime(b.pan, now(), 0.05); }, f => { const p = Math.round((f * 2 - 1) * 100); return p === 0 ? 'C' : (p < 0 ? 'L ' + (-p) : 'R ' + p); });
  miniDial(b.el.querySelector('[data-fx=level]'), () => b.vol, v => { b.vol = v; if (b.a) b.a.level.gain.setTargetAtTime(v * v, now(), 0.05); }, f => Math.round(f * 100) + '%');
});
function applyAge() {
  if (!S) return;
  boxes.forEach(b => Object.values(b.a.reeds).forEach(r => { r.lg.gain.setTargetAtTime(driftCents(), now(), 0.3); r.lgR.gain.setTargetAtTime(driftCents(), now(), 0.3); r.o.detune.setTargetAtTime(reedDet(b, -1), now(), 0.3); r.oR.detune.setTargetAtTime(reedDet(b, 1), now(), 0.3); }));
}
miniDial($('age'), () => age, v => { age = v; applyAge(); }, f => f < 0.04 ? 'new' : Math.round(25 * f * 10) / 10 + ' ¢');
miniDial($('width'), () => width, v => { width = v; applyAge(); }, f => f < 0.02 ? 'mono' : '±' + (12 * f).toFixed(1) + ' ¢');
miniDial($('breath'), () => breath, v => { breath = v; }, f => Math.round(f * 200) + '%');
miniDial($('master'), () => masterLvl, v => { masterLvl = v; if (S) S.master.gain.setTargetAtTime(0.9 * v * v, now(), 0.05); }, f => Math.round(f * 100) + '%');
// Keep a follower's pulse in step with the clock: phase = clock phase × ratio (+ a constant that stays put).
function alignPhase(b) { b.phase = boxes[0].phase * RATIOS[b.ri]; }
function setLock(on) {

  boxes.forEach(renderBox);
}
$('lock').addEventListener('click', () => setLock(!lock));
// Hold is the bottom of the Pump sweep: breathing slows, then stops where it is.
function isHeld(b) { return (lock && b.i > 0) ? (boxes[0].rate <= HOLD_RATE || effRate(b) <= HOLD_RATE) : b.rate <= HOLD_RATE; }

function setOct(b, on) { b.oct = on; retune(b); renderBox(b); }
function renderBox(b) {
  if (b.renderPump) b.renderPump();
  b.nameEl.innerHTML = 'Box ' + (b.i + 1) + (lock && b.i === 0 ? '<small>clock</small>' : '');
  b.pw.classList.toggle('on', b.on);
  if (b.vptr) { const ids = Object.keys(VOICES), i = ids.indexOf(b.voice); b.vptr.style.setProperty('--r', (-135 + i * 270 / (ids.length - 1)) + 'deg'); b.vlab.forEach((d, k) => d.classList.toggle('on', k === i)); }
  if (b.octBtn) b.octBtn.classList.toggle('on', b.oct);

  b.strip.classList.toggle('held', b.on && isHeld(b));
  b.handle.style.bottom = 'calc(26px + (100% - 52px) * ' + b.v.toFixed(4) + ')';
  b.handle.style.top = 'auto';

}
function stopAll() { boxes.forEach(b => setOn(b, false)); }

// ---------- Switch ----------
const sw = $('sw');
MODE_LIST.forEach(m => { const d = document.createElement('div'); d.className = 'lab'; d.id = 'lab-' + m.id; d.title = m.ratio; d.textContent = m.name; sw.appendChild(d); });
function setMode(m, fromUser = true) {
  if (fromUser) ensureAudio();
  mode = m;
  const i = MODE_LIST.findIndex(x => x.id === m);
  sw.style.setProperty('--i', i);
  MODE_LIST.forEach(x => $('lab-' + x.id).classList.toggle('on', x.id === m));
  boxes.forEach(b => {
    if (!b.a) return;
    const t = now(), V = VOICES[b.voice];
    Object.entries(b.a.reeds).forEach(([slot, r]) => {
      if (!slot.includes('I')) return;
      const hz = reedHz(b, slot), gn = r.gate.gain;
      gn.cancelScheduledValues(t); gn.setValueAtTime(gn.value, t); gn.linearRampToValueAtTime(0, t + 0.15);
      r.o.frequency.setValueAtTime(hz, t + 0.16); r.oR.frequency.setValueAtTime(hz, t + 0.16);
      if (b.on) { gn.setValueAtTime(0, t + 0.16); gn.linearRampToValueAtTime(levelFor(b, slot), t + 0.16 + Math.min(V.attack, 1.2)); }
    });
  });
}
const modeIndex = () => MODE_LIST.findIndex(x => x.id === mode);
let swDrag = null;
const swFromEvent = e => { const rc = sw.getBoundingClientRect(); const i = Math.max(0, Math.min(MODE_LIST.length - 1, Math.floor((e.clientX - rc.left) / rc.width * MODE_LIST.length))); if (MODE_LIST[i].id !== mode) setMode(MODE_LIST[i].id); };
sw.addEventListener('pointerdown', e => { try { sw.setPointerCapture(e.pointerId); } catch (_) {} swDrag = e.pointerId; swFromEvent(e); });
sw.addEventListener('pointermove', e => { if (swDrag === e.pointerId) swFromEvent(e); });
sw.addEventListener('pointerup', () => swDrag = null); sw.addEventListener('pointercancel', () => swDrag = null);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); stopAll(); }
  else if (e.key === 'l' || e.key === 'L') setLock(!lock);
  else if (e.key === 'ArrowLeft') setMode(MODE_LIST[Math.max(0, modeIndex() - 1)].id);
  else if (e.key === 'ArrowRight') setMode(MODE_LIST[Math.min(MODE_LIST.length - 1, modeIndex() + 1)].id);
});
setMode('fifth', false);

// ---------- Bellows + voice, per box ----------
let last = performance.now();
function tick() {
  const t = performance.now(), dt = Math.min(0.05, (t - last) / 1000); last = t;
  boxes.forEach(b => {
    const v = b.v;
    b.sq += (b.sqTarget - b.sq) * Math.min(1, (b.sqTarget > b.sq ? 9 : 3) * dt);   // squeeze: quick to push, slower to let go
    const held = b.on && b.a && isHeld(b);
    if (held && b.heldBase === null) b.heldBase = b.pressure - 0.55 * b.sq;
    if (!held) b.heldBase = null;
    if (held) b.target = Math.min(1.05, b.heldBase + 0.55 * b.sq);   // held: the breath stays where it was, plus any squeeze

      const at = now();
      b.a.pressure.gain.setTargetAtTime(Math.pow(p, 1.35), at, 0.03);
      b.a.lp.frequency.setTargetAtTime(((700 + 2200 * p) * (0.35 + 0.65 * v) + 400 * v) * VOICES[b.voice].lp * (1 + 1.6 * b.grit), at, 0.05);   // voice opens the tone; grit lifts the ceiling toward 8 kHz
      b.a.ngain.gain.setTargetAtTime((0.012 + 0.03 * v) * p, at, 0.05);                              // more breath at the top
      b.a.bend.offset.setTargetAtTime(-9 * p, at, 0.05);
      const pre = 1 + (b.drive * 9 + Math.pow(b.drive, 3) * 30) * (0.35 + 0.85 * p);   // up to ~40× at full; harder pumping breaks up more
      b.a.pre.gain.setTargetAtTime(pre, at, 0.05);
      b.a.post.gain.setTargetAtTime(1 / Math.pow(pre, 0.62), at, 0.05);   // keep loudness roughly steady
    }

    if (b.needle) b.needle.style.setProperty('--n', (-60 + 120 * Math.min(1, p)) + 'deg');
    b.strip.classList.toggle('held', b.on && isHeld(b));
    b.glow.style.opacity = b.on ? (0.12 + 0.7 * p).toFixed(3) : 0;
  });

}
requestAnimationFrame(tick);
