<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shruti</title>
<style>
  :root { --bg:#0a1020; --line:#1d2a45; --ink:#e8edf7; --dim:#8a97b3; --accent:#4fd1ff; color-scheme: dark; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system, system-ui, "Inter", sans-serif; display:flex; flex-direction:column; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); -webkit-user-select:none; user-select:none; }
  header { display:flex; justify-content:space-between; align-items:baseline; color:var(--dim); font-size:13px; letter-spacing:.06em; text-transform:uppercase; padding: 4px 6px 14px; }
  header b { color:var(--ink); font-weight:600; letter-spacing:0; text-transform:none; font-size:15px; }
  main { flex:1; display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:16px; min-height:0; }
  @media (max-width:560px), (orientation:portrait) { main { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) minmax(0,1fr); } }
  .pad { position:relative; border-radius:22px; border:1px solid var(--line); background:#10192d; cursor:pointer; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; touch-action:manipulation; transition: border-color .3s; }
  .pad .glow { position:absolute; inset:0; background: radial-gradient(ellipse at 50% 60%, rgba(79,209,255,.55), rgba(79,209,255,.08) 55%, transparent 75%); opacity:0; transition: opacity .25s; pointer-events:none; }
  .pad .name { position:relative; font-size: clamp(34px, 7vw, 64px); font-weight:200; letter-spacing:-.02em; line-height:1; }
  .pad .sub { position:relative; color:var(--dim); font-size:14px; }
  .pad.on { border-color: rgba(79,209,255,.6); }
  .pad.on .name { color:var(--accent); text-shadow: 0 0 24px rgba(79,209,255,.7); }
  .pad.on .sub { color:#c9e9f7; }
  footer { color:var(--dim); font-size:12px; text-align:center; padding-top:12px; }
</style>
</head>
<body>
  <header><span><b>Shruti</b> · B2</span><span>tap to play · tap again to stop</span></header>
  <main>
    <div class="pad" id="classic"><div class="glow"></div><div class="name">Fifth</div><div class="sub">home · fifth · octave</div></div>
    <div class="pad" id="open"><div class="glow"></div><div class="name">Fourth</div><div class="sub">home · fourth · octave</div></div>
  </main>
  <footer>Space toggles the last pad</footer>

<script>
'use strict';
const HOME_HZ = 123.47;            // B2
const DRIFT = 10.5;                // cents
const REEDS = { home: 1, fourth: 4 / 3, fifth: 3 / 2, octave: 2 };
const MODES = { classic: ['home', 'fifth', 'octave'], open: ['home', 'fourth', 'octave'] };

let ctx = null, A = null, mode = null, lastMode = 'classic';
const state = { pressure: 0, target: 0 };

function reedWave() {
  const N = 64, re = new Float32Array(N), im = new Float32Array(N);
  for (let n = 1; n < N; n++) { let a = 1 / Math.pow(n, 1.05); if (n >= 3 && n <= 7) a *= 1.35; if (n > 30) a *= Math.pow(0.9, n - 30); im[n] = a; }
  return ctx.createPeriodicWave(re, im);
}
function ensureAudio() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const g = v => { const n = ctx.createGain(); n.gain.value = v; return n; };
  A = { reeds: {} };
  A.sum = g(1);
  A.f1 = ctx.createBiquadFilter(); A.f1.type = 'peaking'; A.f1.frequency.value = 620; A.f1.Q.value = 1.6; A.f1.gain.value = 5;
  A.f2 = ctx.createBiquadFilter(); A.f2.type = 'peaking'; A.f2.frequency.value = 1750; A.f2.Q.value = 2.2; A.f2.gain.value = 4;
  A.lp = ctx.createBiquadFilter(); A.lp.type = 'lowpass'; A.lp.frequency.value = 2500; A.lp.Q.value = 0.3;
  A.hp = ctx.createBiquadFilter(); A.hp.type = 'highpass'; A.hp.frequency.value = 70;
  A.pressure = g(0); A.master = g(0.5);
  A.sum.connect(A.f1).connect(A.f2).connect(A.lp).connect(A.hp).connect(A.pressure).connect(A.master).connect(ctx.destination);
  A.bend = ctx.createConstantSource(); A.bend.offset.value = 0; A.bend.start();
  const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  A.noise = ctx.createBufferSource(); A.noise.buffer = buf; A.noise.loop = true; A.noise.start();
  A.nbp = ctx.createBiquadFilter(); A.nbp.type = 'bandpass'; A.nbp.frequency.value = 2600; A.nbp.Q.value = 0.7;
  A.ngain = g(0); A.noise.connect(A.nbp).connect(A.ngain).connect(A.pressure);
  const wave = reedWave();
  Object.keys(REEDS).forEach((id, i) => {
    const o = ctx.createOscillator(); o.setPeriodicWave(wave); o.frequency.value = HOME_HZ * REEDS[id];
    const gate = g(0), lfo = ctx.createOscillator(), lg = g(DRIFT);
    lfo.frequency.value = 1 / (17 + i * 6.3); lfo.connect(lg).connect(o.detune); A.bend.connect(o.detune);
    o.connect(gate).connect(A.sum); o.start(); lfo.start();
    A.reeds[id] = { o, gate };
  });
}
const now = () => ctx.currentTime;
function setReed(id, open) {
  const r = A.reeds[id], t = now();
  r.gate.gain.cancelScheduledValues(t); r.gate.gain.setValueAtTime(r.gate.gain.value, t);
  if (open) { r.gate.gain.linearRampToValueAtTime(0.22, t + 0.28); r.o.detune.cancelScheduledValues(t); r.o.detune.setValueAtTime(-25, t); r.o.detune.linearRampToValueAtTime(0, t + 0.35); }
  else r.gate.gain.linearRampToValueAtTime(0, t + 0.18);
}
function setMode(m) {
  ensureAudio();
  mode = (mode === m) ? null : m;
  if (mode) lastMode = mode;
  Object.keys(REEDS).forEach(id => setReed(id, !!mode && MODES[mode].includes(id)));
  document.getElementById('classic').classList.toggle('on', mode === 'classic');
  document.getElementById('open').classList.toggle('on', mode === 'open');
}
document.getElementById('classic').onclick = () => setMode('classic');
document.getElementById('open').onclick = () => setMode('open');
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); setMode(mode || lastMode); } });

// Bellows: auto pump only. Pressure rises fast, falls slow, and drives loudness, brightness, breath and a slight flattening.
let last = performance.now(), phase = 0;
function tick() {
  const t = performance.now(), dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (mode) { phase += dt * 0.19; const s = Math.sin(phase * 2 * Math.PI); state.target = 0.62 + 0.28 * Math.sign(s) * Math.pow(Math.abs(s), 0.6); }
  else state.target = 0;
  const k = state.target > state.pressure ? 4.5 : 1.1;
  state.pressure += (state.target - state.pressure) * Math.min(1, k * dt);
  const p = state.pressure;
  if (A) {
    const at = now();
    A.pressure.gain.setTargetAtTime(Math.pow(p, 1.35), at, 0.03);
    A.lp.frequency.setTargetAtTime(1400 + 4200 * p, at, 0.05);
    A.ngain.gain.setTargetAtTime(0.035 * p, at, 0.05);
    A.bend.offset.setTargetAtTime(-9 * p, at, 0.05);
  }
  const el = mode && document.getElementById(mode);
  document.querySelectorAll('.glow').forEach(g => g.style.opacity = 0);
  if (el) el.querySelector('.glow').style.opacity = (0.25 + 0.75 * p).toFixed(3);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
