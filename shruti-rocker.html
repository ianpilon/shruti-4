<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shruti Rocker</title>
<style>
  :root { --bg:#0a1020; --card:#10192d; --line:#1d2a45; --ink:#e8edf7; --dim:#8a97b3; --accent:#4fd1ff; color-scheme: dark; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system, system-ui, "Inter", sans-serif; display:flex; flex-direction:column; gap:14px; padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); -webkit-user-select:none; user-select:none; touch-action:none; }
  header { display:flex; justify-content:space-between; align-items:baseline; color:var(--dim); font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:0 4px; }
  header b { color:var(--ink); font-weight:600; letter-spacing:0; text-transform:none; font-size:15px; }

  /* Rocker: three detents, one knob */
  .rocker { position:relative; height:96px; border-radius:20px; background:var(--card); border:1px solid var(--line); cursor:grab; touch-action:none; }
  .rocker .labels { position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr 1fr; align-items:center; text-align:center; pointer-events:none; }
  .rocker .labels div { font-size:clamp(18px, 3.4vw, 26px); font-weight:300; color:var(--dim); transition:color .2s, text-shadow .2s; }
  .rocker .labels div.on { color:var(--accent); text-shadow:0 0 18px rgba(79,209,255,.6); font-weight:400; }
  .rocker .labels div.off { font-size:13px; letter-spacing:.1em; text-transform:uppercase; }
  .rocker .detents { position:absolute; left:0; right:0; bottom:10px; display:grid; grid-template-columns:1fr 1fr 1fr; pointer-events:none; }
  .rocker .detents i { display:block; width:6px; height:6px; border-radius:50%; background:#2c3d63; margin:0 auto; }
  .rocker .knob { position:absolute; top:8px; bottom:8px; width:calc(100% / 3 - 12px); left:6px; border-radius:14px; background:linear-gradient(#22304f, #182440); border:1px solid #2f4370; box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); transition: left .18s cubic-bezier(.2,.8,.2,1); pointer-events:none; }
  .rocker.dragging .knob { transition:none; }
  .rocker .knob::after { content:""; position:absolute; left:50%; top:50%; width:34px; height:4px; margin:-2px 0 0 -17px; border-radius:2px; background:#3a4f80; }

  /* Bellows pad fills the rest */
  .pad { position:relative; flex:1; min-height:0; border-radius:24px; background:var(--card); border:1px dashed #2c3d63; overflow:hidden; cursor:pointer; touch-action:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; transition:border-color .2s; }
  .pad.pressing { border-style:solid; border-color:var(--accent); }
  .pad .glow { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 62%, rgba(79,209,255,.55), rgba(79,209,255,.08) 55%, transparent 75%); opacity:0; pointer-events:none; }
  .pad .level { position:absolute; left:0; right:0; bottom:0; height:0%; background:linear-gradient(rgba(79,209,255,0), rgba(79,209,255,.16)); pointer-events:none; }
  .pad .notes { position:relative; font-size:clamp(28px, 6vw, 56px); font-weight:200; letter-spacing:-.02em; line-height:1; text-align:center; }
  .pad .hint { position:relative; color:var(--dim); font-size:14px; text-align:center; }
  .pad .mode { position:absolute; top:14px; left:18px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .pad .mode b { color:var(--accent); font-weight:600; letter-spacing:0; text-transform:none; }
  .pump { position:absolute; top:12px; right:16px; width:min(260px, 46%); display:flex; align-items:center; gap:10px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .pump input { flex:1; accent-color:var(--accent); touch-action:none; }
  .pump output { color:var(--ink); font-variant-numeric:tabular-nums; text-transform:none; letter-spacing:0; min-width:64px; text-align:right; }
  footer { color:var(--dim); font-size:12px; text-align:center; }
  kbd { font:11px ui-monospace, Menlo, monospace; background:#0b1324; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
</style>
</head>
<body>
  <header><span><b>Shruti</b> · B2</span><span>one switch · one bellows</span></header>

  <div class="rocker" id="rocker" role="radiogroup" aria-label="Drone">
    <div class="knob" id="knob"></div>
    <div class="labels"><div id="l0">Fourth</div><div id="l1" class="off">off</div><div id="l2">Fifth</div></div>
    <div class="detents"><i></i><i></i><i></i></div>
  </div>

  <div class="pad" id="pad">
    <div class="glow" id="glow"></div>
    <div class="level" id="level"></div>
    <div class="mode" id="mode">bellows · <b>auto</b></div>
    <div class="pump"><span>pump</span><input id="pump" type="range" min="0" max="100" value="0" aria-label="Pump speed"><output id="pump-out">11 / min</output></div>
    <div class="notes" id="notes">off</div>
    <div class="hint" id="hint">Press and hold to pump. Slide up for more air. Let go and it sighs, then pumps itself.</div>
  </div>

  <footer><kbd>←</kbd> <kbd>→</kbd> move the switch · <kbd>Space</kbd> off / back on</footer>

<script>
'use strict';
const HOME_HZ = 123.47, DRIFT = 10.5;
const REEDS = { home: 1, fourth: 4 / 3, fifth: 3 / 2, octave: 2 };
const POS = [ { id: 'fourth', open: ['home', 'fourth', 'octave'], label: 'home · fourth · octave' }, null, { id: 'fifth', open: ['home', 'fifth', 'octave'], label: 'home · fifth · octave' } ];

let ctx = null, A = null;
const state = { pos: 1, lastPos: 2, pressure: 0, target: 0, padDown: false, padY: 1, releasedAt: -1e9, rate: 0.19 };
const RATE_MIN = 0.19, RATE_MAX = 6;   // strokes per second; above ~6 the pulse itself becomes a tone
const $ = id => document.getElementById(id);

// ---------- Audio (same reed engine as the full box) ----------
function reedWave() {
  const N = 64, re = new Float32Array(N), im = new Float32Array(N);
  for (let n = 1; n < N; n++) { let a = 1 / Math.pow(n, 1.05); if (n >= 3 && n <= 7) a *= 1.35; if (n > 30) a *= Math.pow(0.9, n - 30); im[n] = a; }
  return ctx.createPeriodicWave(re, im);
}
function ensureAudio() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const g = v => { const n = ctx.createGain(); n.gain.value = v; return n; };
  A = { reeds: {} };
  A.sum = g(1);
  A.f1 = ctx.createBiquadFilter(); A.f1.type = 'peaking'; A.f1.frequency.value = 620; A.f1.Q.value = 1.6; A.f1.gain.value = 5;
  A.f2 = ctx.createBiquadFilter(); A.f2.type = 'peaking'; A.f2.frequency.value = 1750; A.f2.Q.value = 2.2; A.f2.gain.value = 4;
  A.lp = ctx.createBiquadFilter(); A.lp.type = 'lowpass'; A.lp.frequency.value = 2500; A.lp.Q.value = 0.3;
  A.hp = ctx.createBiquadFilter(); A.hp.type = 'highpass'; A.hp.frequency.value = 70;
  A.pressure = g(0); A.master = g(0.5);
  A.sum.connect(A.f1).connect(A.f2).connect(A.lp).connect(A.hp).connect(A.pressure).connect(A.master).connect(ctx.destination);
  A.bend = ctx.createConstantSource(); A.bend.offset.value = 0; A.bend.start();
  const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  A.noise = ctx.createBufferSource(); A.noise.buffer = buf; A.noise.loop = true; A.noise.start();
  A.nbp = ctx.createBiquadFilter(); A.nbp.type = 'bandpass'; A.nbp.frequency.value = 2600; A.nbp.Q.value = 0.7;
  A.ngain = g(0); A.noise.connect(A.nbp).connect(A.ngain).connect(A.pressure);
  const wave = reedWave();
  Object.keys(REEDS).forEach((id, i) => {
    const o = ctx.createOscillator(); o.setPeriodicWave(wave); o.frequency.value = HOME_HZ * REEDS[id];
    const gate = g(0), lfo = ctx.createOscillator(), lg = g(DRIFT);
    lfo.frequency.value = 1 / (17 + i * 6.3); lfo.connect(lg).connect(o.detune); A.bend.connect(o.detune);
    o.connect(gate).connect(A.sum); o.start(); lfo.start();
    A.reeds[id] = { o, gate };
  });
  applyPos();
}
const now = () => ctx.currentTime;
function setReed(id, open) {
  const r = A.reeds[id], t = now();
  r.gate.gain.cancelScheduledValues(t); r.gate.gain.setValueAtTime(r.gate.gain.value, t);
  if (open) { r.gate.gain.linearRampToValueAtTime(0.22, t + 0.28); r.o.detune.cancelScheduledValues(t); r.o.detune.setValueAtTime(-25, t); r.o.detune.linearRampToValueAtTime(0, t + 0.35); }
  else r.gate.gain.linearRampToValueAtTime(0, t + 0.18);
}
function applyPos() {
  if (!A) return;
  const p = POS[state.pos], open = p ? p.open : [];
  Object.keys(REEDS).forEach(id => setReed(id, open.includes(id)));
}

// ---------- Rocker ----------
const rocker = $('rocker'), knob = $('knob');
function setPos(i, fromUser = true) {
  i = Math.max(0, Math.min(2, i));
  if (fromUser) ensureAudio();
  if (i === state.pos) { renderRocker(); return; }
  state.pos = i; if (i !== 1) state.lastPos = i;
  applyPos(); renderRocker();
}
function renderRocker() {
  knob.style.left = `calc(${state.pos} * 100% / 3 + 6px)`;
  [0, 1, 2].forEach(i => $('l' + i).classList.toggle('on', i === state.pos && i !== 1));
  const p = POS[state.pos];
  $('notes').textContent = p ? p.label : 'off';
  rocker.setAttribute('aria-valuetext', p ? p.id : 'off');
}
let dragging = false;
const posFromX = e => { const r = rocker.getBoundingClientRect(); return Math.min(2, Math.max(0, Math.floor(((e.clientX - r.left) / r.width) * 3))); };
rocker.addEventListener('pointerdown', e => { dragging = true; rocker.setPointerCapture(e.pointerId); rocker.classList.add('dragging'); setPos(posFromX(e)); });
rocker.addEventListener('pointermove', e => { if (dragging) setPos(posFromX(e)); });
const endDrag = () => { dragging = false; rocker.classList.remove('dragging'); renderRocker(); };
rocker.addEventListener('pointerup', endDrag); rocker.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); setPos(state.pos - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); setPos(state.pos + 1); }
  else if (e.key === ' ') { e.preventDefault(); setPos(state.pos === 1 ? state.lastPos : 1); }
});

// ---------- Bellows ----------
const pad = $('pad');
const padPos = e => { const r = pad.getBoundingClientRect(); state.padY = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height)); };
pad.addEventListener('pointerdown', e => { ensureAudio(); pad.setPointerCapture(e.pointerId); state.padDown = true; padPos(e); pad.classList.add('pressing'); });
pad.addEventListener('pointermove', e => { if (state.padDown) padPos(e); });
const padUp = () => { if (!state.padDown) return; state.padDown = false; state.releasedAt = performance.now(); pad.classList.remove('pressing'); };
pad.addEventListener('pointerup', padUp); pad.addEventListener('pointercancel', padUp);

const AUTO_AFTER = 2.5;   // seconds after letting go before the box pumps itself
const pumpEl = $('pump'), pumpOut = $('pump-out');
pumpEl.addEventListener('pointerdown', e => e.stopPropagation());
pumpEl.oninput = () => {
  state.rate = RATE_MIN * Math.pow(RATE_MAX / RATE_MIN, pumpEl.value / 100);
  pumpOut.textContent = state.rate < 1 ? Math.round(state.rate * 60) + ' / min' : state.rate.toFixed(1) + ' / s';
};
let last = performance.now(), phase = 0;
function tick() {
  const t = performance.now(), dt = Math.min(0.05, (t - last) / 1000); last = t;
  const playing = state.pos !== 1 && !!A;
  let modeText = 'auto';
  if (!playing) state.target = 0;
  else if (state.padDown) { state.target = 0.35 + 0.65 * state.padY; modeText = 'hand'; }
  else if ((t - state.releasedAt) / 1000 < AUTO_AFTER) { state.target = 0.10; modeText = 'sighing'; }
  else { phase += dt * state.rate; const s = Math.sin(phase * 2 * Math.PI); const depth = 0.28 + 0.12 * Math.min(1, state.rate / 2); state.target = 0.62 + depth * Math.sign(s) * Math.pow(Math.abs(s), 0.6); }
  // A small bellows empties faster when you work it faster: response scales with stroke rate.
  const k = state.target > state.pressure ? Math.max(4.5, state.rate * 9) : Math.max(1.1, state.rate * 5);
  state.pressure += (state.target - state.pressure) * Math.min(1, k * dt);
  const p = state.pressure;
  if (A) {
    const at = now();
    A.pressure.gain.setTargetAtTime(Math.pow(p, 1.35), at, 0.03);
    A.lp.frequency.setTargetAtTime(1400 + 4200 * p, at, 0.05);
    A.ngain.gain.setTargetAtTime(0.035 * p, at, 0.05);
    A.bend.offset.setTargetAtTime(-9 * p, at, 0.05);
  }
  $('glow').style.opacity = playing ? (0.2 + 0.8 * p).toFixed(3) : 0;
  $('level').style.height = Math.round(p * 100) + '%';
  $('mode').innerHTML = 'bellows · <b>' + modeText + '</b>';
  requestAnimationFrame(tick);
}
renderRocker();
requestAnimationFrame(tick);
</script>
</body>
</html>
